<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apna POS - Smart Restaurant Billing, POS, WhatsApp AI Agent & Inventory Management System.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Apna POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Apna POS - Restaurant POS & Smart Billing</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-orange: #FF5722;
      --primary-orange-light: #FF7A00;
      --primary-teal: #0C464C;
      --accent-green: #12E47E;
      --bg-surface: #F8FAFC;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      box-sizing: border-box;
    }

    html, body {
      background-color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    /* Sleek Modern Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF5722;
    }

    ::selection {
      background: rgba(255, 87, 34, 0.25);
      color: #FF5722;
    }

    /* Neumorphic smooth transitions */
    .neumorphic-glow {
      box-shadow: 0 8px 24px -4px rgba(255, 87, 34, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
